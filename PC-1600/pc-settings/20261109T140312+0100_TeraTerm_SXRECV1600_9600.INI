; Tera Term settings for the PC-1600 (SXRECV1600), 9600 baud 8N1, no flow control.
; Merge into TERATERM.INI (or Setup > Serial port). Change ComPort to your port.
; Sending the .sxe: File > Send file, "Binary" ticked, no delays (as below).
; Sending the BASIC stub (sxrecv1600_serial.bas, text): untick "Binary"; if lines get lost
; use DelayPerLine=50..100 (ms) in Setup > General (needed on a real PC-1600:
; without it LOAD "COM1:" fails with ERROR 142). Also INIT "COM1:",4096 first.
[Tera Term]
Port=serial
ComPort=1
BaudRate=9600
Parity=none
DataBit=8
StopBit=1
FlowCtrl=none
DelayPerChar=0
DelayPerLine=0
TransBin=on
FileSendHighSpeedMode=off
SendfileDelayType=NoDelay
