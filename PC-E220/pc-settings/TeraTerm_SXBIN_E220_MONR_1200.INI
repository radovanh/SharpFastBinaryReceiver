; Tera Term settings for installing SXBIN on a Sharp PC-E220: MON, R, then File > Send file
; > sxbin_e220.ihx as TEXT ("Binary" NOT ticked). 1200 baud 8N1 = the E220's default SIO
; settings (TEXT > Sio). Also check Setup > Serial port: transmit delay 100 msec/line
; (the Monitor needs about that long to decode each line).
; Change ComPort to your port.
[Tera Term]
Port=serial
ComPort=1
BaudRate=1200
Parity=none
DataBit=8
StopBit=1
FlowCtrl=none
DelayPerChar=0
DelayPerLine=100
TransBin=off
FileSendHighSpeedMode=off
SendfileDelayType=NoDelay
