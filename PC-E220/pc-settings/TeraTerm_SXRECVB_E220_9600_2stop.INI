; Tera Term settings for sending an .sxb to a Sharp PC-E220 (SXBIN), 9600 baud 8N2.
; The E220 receives with a bit-banged UART and needs the second stop bit (see the README).
; Merge these lines into TERATERM.INI (or Setup > Serial port in the program), then
; File > Send file > your .sxb with "Binary" ticked. Change ComPort to your port.
[Tera Term]
Port=serial
ComPort=1
BaudRate=9600
Parity=none
DataBit=8
StopBit=2
FlowCtrl=none
DelayPerChar=0
DelayPerLine=0
TransBin=on
FileSendHighSpeedMode=off
SendfileDelayType=NoDelay
