; Tera Term settings for sending an .sxb to a Sharp PC-G850V (SXRECVB), 19200 baud 8N1 (untested option, see TEST_19200.md).
; For the PC-G815 (and as a safe choice for any bit-banged receiver) set StopBit=2.
; Merge these lines into TERATERM.INI (or Setup > Serial port in the program), then
; File > Send file > your .sxb with "Binary" ticked. Change ComPort to your port.
[Tera Term]
Port=serial
ComPort=1
BaudRate=19200
Parity=none
DataBit=8
StopBit=1
FlowCtrl=none
DelayPerChar=0
DelayPerLine=0
TransBin=on
FileSendHighSpeedMode=off
SendfileDelayType=NoDelay
